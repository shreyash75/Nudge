apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: nudge
  labels:
    app: backend

spec: 
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for postgres..."
            until nc -z postgres 5432; do
              sleep 3
            done
            echo "Postgres is ready!"
      containers:
      - name: backend
        image: shreyash75/nudge-backend:ad4c582
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_NAME
        resources:
         requests:
           cpu: "100m"
           memory: "128Mi"
         limits:
           cpu: "300m"
           memory: "256Mi"
        livenessProbe:
          httpGet:
           path: /api/health
           port: 5000
        readinessProbe:
         httpGet:
            path: /api/health
            port: 5000
         initialDelaySeconds: 5
         periodSeconds: 5
      